[package]
name = "component-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "component-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasmtime = { version = "27", features = ["component-model"] }
wasmtime-wasi = "27"
wasmtime-wasi-http = "27"
