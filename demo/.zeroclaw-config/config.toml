[risk_profiles.default.delegation_policy]
mode = "forbidden"

# The [REDACTED_HIGH_ENTROPY_TOKEN] substitutions were never the model's
# doing (switching models here never should have mattered, and didn't) —
# this is ZeroClaw's own outbound leak detector, which scans every message
# before it's sent and heuristically redacts any long, high-Shannon-entropy
# token as a probable leaked credential. Solana addresses/signatures are
# base58 and easily cross that threshold. Disabling only the entropy
# heuristic keeps every deterministic, low-false-positive check (Stripe,
# AWS, OpenAI, Anthropic, GitHub, Slack, JWTs, DB connection URLs, bot
# tokens) fully active — a real leaked API key or bot token still gets
# caught and redacted, only the "any random-looking string" guess is off.
[security.leak_detection]
high_entropy_tokens = false

[agents.carapace_demo.a2a]
exposed_skills = []
published = false

[agents.carapace_demo.identity]
format = "openclaw"

[agents.carapace_demo.memory]
backend = "sqlite"

# Disabled: this runs a separate, small classifier model *before* the real
# agent turn to decide whether to even respond — with no tool access and no
# real policy data, just the raw conversation text. It guessed "exceeds your
# daily limit" on a 1 SOL transfer when 1.765 SOL was actually remaining
# (the real constraint was the 0.5 SOL per-transaction cap, which it never
# checked and mislabeled). That's an LLM's guess overriding what the chain
# would have said, which is the exact failure mode Carapace exists to
# prevent — for a single-user DM bot with no group-chat noise to filter,
# this precheck has no upside, so every message now goes straight to the
# real agent turn, which actually calls the tools and reports the real,
# on-chain-verified outcome.
[agents.carapace_demo.precheck]
enabled = false
timeout_secs = 5

[agents.carapace_demo.workspace]
read_memory_from = []
unrestricted_filesystem = false

