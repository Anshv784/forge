[workspace]
resolver = "2"
members = [
    "plugins/carapace_list_receipts",
    "plugins/carapace_policy_status",
    "plugins/solana-core",
    "scripts/sign-plugin-manifest",
    "spikes/component-harness",
    "spikes/wasm-http-spike",
    "spikes/wasm-signing-spike",
]

# NOTE: `programs/carapace` is an Anchor workspace and intentionally kept out
# of this workspace (Anchor pins its own toolchain/profile assumptions).
# `plugins/*` crates are added to this workspace as they are built out.

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anshv784/forge"

[profile.release]
panic = "abort"
strip = true
